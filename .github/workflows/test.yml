name: Test Tokenization Challenge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure generator
        run: |
          git config --global user.name "Mabolla Builder"
          git config --global user.email "133767935+Mabolla@users.noreply.github.com"
          corepack enable

      - name: Scaffold official challenge
        if: ${{ hashFiles('challenge-tokenization/package.json') == '' }}
        run: |
          printf '\n' | npx --yes create-eth@2.0.23 -e challenge-tokenization challenge-tokenization
          rm -rf challenge-tokenization/.git
          find challenge-tokenization -type d -name node_modules -prune -exec rm -rf {} +
          find challenge-tokenization -type d -name .next -prune -exec rm -rf {} +
          git add -f challenge-tokenization
          git commit -m "feat: add SpeedRun Ethereum tokenization challenge"
          git push

      - name: Install challenge
        working-directory: challenge-tokenization
        run: yarn install

      - name: Run grading tests
        working-directory: challenge-tokenization
        run: yarn test

      - name: Build Sepolia frontend
        working-directory: challenge-tokenization
        run: yarn next:build
